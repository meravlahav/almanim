/* Layout: the real site's mobile-first single column (max 720px), RTL, calm sage + sand palette from the spec */
:root{--bg:#FAF6F0;--sand:#ECE3D6;--primary:#5F7A6A;--primary-soft:#DDE6DF;--ink:#3E5547;--accent:#B9785C;--accent-soft:#F3E3D8;--text:#33302C;--muted:#5A544E;--border:#E2D8CA;--surface:#FFFFFF;--on-primary:#FFFFFF;
--display:"Frank Ruhl Libre","David Libre",Georgia,serif;--body:"Assistant","Noto Sans Hebrew",Arial,sans-serif}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.6}
#app{position:relative;max-width:720px;margin-inline:auto;padding-inline:16px;padding-block:0 40px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px;border-bottom:1px solid var(--border);margin-bottom:24px}
.brand{line-height:1;font-family:var(--display);font-weight:700;font-size:20px;color:var(--ink);background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:8px;padding:0}
nav.menu{display:flex;gap:4px;flex-wrap:wrap}
nav.menu button{font:inherit;font-size:15px;background:none;border:0;color:var(--muted);padding:6px 8px;border-radius:8px;cursor:pointer}
nav.menu button:hover{background:var(--primary-soft);color:var(--ink)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,7vw,36px);line-height:1.25;margin:0 0 12px;text-wrap:balance;color:var(--ink)}
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:36px 0 14px;color:var(--text)}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:15px}
button{font-family:inherit}
.btn{box-sizing:border-box;font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 22px;min-height:48px;cursor:pointer;background:var(--primary);color:var(--on-primary)}
.btn.sm{min-height:40px;padding:8px 20px;border-radius:999px;font-size:15px;width:fit-content}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:none;color:var(--ink);text-decoration:underline;text-underline-offset:4px;padding-inline:8px}
.btn.secondary{background:var(--primary-soft);color:var(--ink)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.home{text-align:center;padding-block:28px 32px;background:radial-gradient(ellipse at 50% 0%,var(--sand) 0%,transparent 70%);border-radius:24px}
.embrace{display:block;margin:0 auto 6px}
.welcome{max-width:50ch;margin:0 auto 14px;color:var(--text);font-size:18px}
.home .leaf{margin-inline:auto;display:block}
.home p.lead{font-size:18px;max-width:50ch;margin:0 auto 24px}
.progress{color:var(--muted);font-size:15px;margin-bottom:6px}
.choices{display:grid;gap:10px;margin-block:18px 24px}
.choice{display:block;width:100%;text-align:start;background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:14px 16px;font:inherit;color:var(--text);cursor:pointer}
.choice[aria-checked="true"]{background:var(--primary-soft);border-color:var(--primary)}
.choice .hint{display:block;color:var(--muted);font-size:15px}
.stepper{display:flex;align-items:center;gap:16px;margin-block:12px 18px}
.stepper button{width:48px;height:48px;border-radius:50%;border:2px solid var(--primary);background:var(--surface);color:var(--ink);font-size:24px;cursor:pointer;line-height:1}
.stepper output{font-size:28px;font-weight:700;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.agerow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.agerow select{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);min-width:120px}
.summary{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;color:var(--muted)}
.summary strong{color:var(--text)}
.linkbtn{background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit;padding:0}
.notice{background:var(--sand);border-radius:12px;padding:12px 14px;font-size:15px;display:flex;gap:10px;margin-top:14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:4px;margin-bottom:12px}
.tabs button{flex:none;font:inherit;font-size:15px;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:99px;padding:6px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.tasks{display:grid;gap:8px}
.task{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.task>button{width:100%;text-align:start;background:none;border:0;padding:12px 14px;font:inherit;color:var(--text);cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.task .cond{display:block;font-size:13px;color:var(--muted)}
.task .chev{color:var(--muted);transition:transform .2s}
.task[open] .chev{transform:rotate(180deg)}
.task .more{padding:0 14px 14px;font-size:17px;display:grid;gap:6px}
.label{font-size:13px;color:var(--muted);display:block}
.cards{display:grid;gap:12px}
@media (min-width:1024px){.cards.orgs{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;display:grid;gap:8px;min-width:0}
.card h3{margin:0;font-size:18px;font-weight:700;line-height:1.35}
.amount{color:var(--ink);font-weight:400}
.asof{font-size:13px;color:var(--muted)}
.info{background:var(--sand);border-radius:16px;padding:16px;margin-top:14px}
.info h3{margin:0 0 8px;font-size:18px}
.info ul{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.orgtop{display:flex;gap:12px;align-items:center}
.tile{width:88px;height:64px;flex:none;border:1px solid var(--border);border-radius:12px;background:var(--primary-soft);display:grid;place-items:center}
.tile.big{width:160px;height:112px}
.tile.has{background:#fff;padding:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile.has img{max-width:72px;max-height:48px;width:auto;height:auto;object-fit:contain;display:block}
.tile.big.has img{max-width:144px;max-height:96px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--primary-soft);color:var(--ink);font-size:13px;border-radius:99px;padding:2px 10px}
.contact{display:grid;gap:14px;margin-top:6px;justify-items:start}
.contact section{display:grid;gap:8px}
.vbtn span{overflow-wrap:anywhere}
.contact a,.contact span.c{color:var(--ink);overflow-wrap:anywhere}
.ltr{direction:ltr;unicode-bidi:isolate}
.detail section{margin-bottom:16px}
.note{border-inline-start:3px solid var(--accent);background:var(--surface);padding:10px 14px;border-radius:8px}
.verify{display:grid;gap:8px}
.verify .vrow{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:grid;gap:8px;align-content:start}
.vact{display:flex;flex-wrap:wrap;gap:8px 10px}
.maillink{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;unicode-bidi:isolate;display:inline-block;max-width:100%;overflow-wrap:anywhere}
.tellink{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;unicode-bidi:isolate;white-space:nowrap}
.vbtn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 12px;border:1px solid var(--border);border-radius:999px;background:var(--bg);color:var(--ink);text-decoration:none;font-weight:700;font-size:15px}
.vbtn:hover{border-color:var(--primary);background:var(--primary-soft)}
.vbtn svg{color:var(--primary);flex:none}
@media (min-width:700px){.verify{grid-template-columns:1fr 1fr}}
footer.site{margin-top:40px;padding-top:16px;border-top:1px solid var(--border);font-size:15px;color:var(--muted)}
.helpline{background:var(--sand);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-top:32px;text-align:center;font-size:15px}
.helpline strong{color:var(--ink)}
.helpline small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
a{color:var(--ink)}
[hidden]{display:none!important}
.brand svg{display:block;flex:none}
.brand span.bt{display:block;line-height:1.2;position:relative;top:2px}
.dedication{margin:28px auto 0;max-width:34ch;text-align:center;font-family:var(--display);font-size:18px;line-height:1.6;color:var(--ink);display:grid;justify-items:center;gap:6px}
.dedication p{margin:0}
header.top{position:relative;flex-wrap:wrap}
.menubtn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:700;font-size:17px;color:var(--ink);background:var(--primary-soft);border:0;border-radius:10px;padding:8px 14px;min-height:44px;cursor:pointer}
.mainnav{display:none;width:100%;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px;margin-top:10px}
.mainnav[data-open]{display:flex}
.mainnav button{display:flex;align-items:center;gap:12px;font:inherit;font-size:17px;color:var(--text);background:none;border:0;border-radius:10px;padding:12px;min-height:48px;cursor:pointer;text-align:start}
.mainnav button svg{color:var(--primary);flex:none}
.mainnav button:hover{background:var(--primary-soft)}
.mainnav button[aria-current="page"]{background:var(--primary-soft);color:var(--ink);font-weight:700}
@media (min-width:900px){
 .menubtn{display:none}
 .mainnav{display:flex;flex-direction:row;width:auto;background:none;border:0;padding:0;margin:0;gap:2px}
 .mainnav button{font-size:15px;padding:8px 6px;min-height:40px;gap:5px;white-space:nowrap}
 .brand .bt{white-space:nowrap}
 .brand{flex:none}
 header.top{flex-wrap:nowrap}
 .mainnav{gap:0}
 .mainnav button svg{width:18px;height:18px}
 .mainnav button:first-child{display:none}
}

.options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px auto 30px;max-width:640px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 8px 12px;font:inherit;color:var(--text);cursor:pointer;text-align:center;box-shadow:0 1px 0 var(--border)}
.opt:hover{border-color:var(--primary);background:var(--primary-soft)}
.opt:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.opt .ic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--primary-soft);display:grid;place-items:center;color:var(--primary)}
.opt b{display:block;font-size:18px;font-weight:700;color:var(--ink);line-height:1.2;text-wrap:balance}
.opt span.l{display:block;color:var(--muted);font-size:13px;line-height:1.4;margin-top:2px;text-wrap:balance}
@media (min-width:600px){.options{gap:14px}.opt{padding:20px 14px 16px;gap:8px}.opt .ic{width:52px;height:52px}.opt b{font-size:18px}.opt span.l{font-size:15px}}
.bigtabs{background:var(--bg);display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-block:10px;margin-top:12px}
.bigtabs button{font:inherit;font-weight:700;font-size:15px;line-height:1.25;min-height:64px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bigtabs button .n{font-weight:400;font-size:13px;color:var(--muted)}
.bigtabs button[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.bigtabs button[aria-selected="true"] .n{color:var(--on-primary)}
.intro{color:var(--muted);margin:14px 0}
a.btn{display:inline-flex!important;align-items:center;justify-content:center;text-decoration:none}
.orgtop h3{min-width:0}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 2px}
.flag{display:inline-block;font-size:13px;font-weight:700;line-height:1.3;padding:3px 10px;border-radius:999px;border:1px solid transparent}
.fl-income{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.fl-local{background:var(--primary-soft);color:var(--ink);border-color:var(--primary)}
.fl-work{background:var(--sand);color:var(--ink);border-color:var(--border)}
.legend{margin:-6px 0 14px;line-height:2}
.flagbox{background:var(--accent-soft);border-inline-start:4px solid var(--accent);border-radius:10px;padding:12px 14px}
.flagbox ul{margin:6px 0 0;padding-inline-start:18px}.flagbox li{margin:4px 0}
.catcols{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:12px;margin-top:8px}
.catcols .choice{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:76px;padding:12px 12px;line-height:1.3;text-wrap:balance}
.catcols .choice .hint{margin-top:4px;line-height:1.35;text-wrap:balance}
.cgh{font-size:17px;margin:0 0 10px;color:var(--ink);line-height:1.35}
@media (max-width:420px){.catcols{gap:10px}.catcols .choice{font-size:17px;padding:10px 8px;min-height:72px}.catcols .hint{font-size:13px}}
.fl-kids{background:#FFFFFF;color:var(--ink);border-color:var(--primary);border-style:dashed}
.kidsh{margin-top:36px;padding-top:18px;border-top:1px solid var(--border)}
.jumps{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.jump{background:var(--surface);border:1px solid var(--primary);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.orgsec:first-of-type{border-top:0;padding-top:0;margin-top:20px}
.star{color:var(--accent);font-weight:700;margin-inline-start:2px}
.amountnote{font-size:15px;color:var(--muted);margin:10px 0 0;line-height:1.5}
.byline{font-family:var(--body);font-size:15px;color:var(--muted);margin-top:10px!important;max-width:40ch}
.dedication.feature{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 18px;margin:8px auto 8px;max-width:none}
.aboutme h2{margin-top:28px}
.sig{font-weight:700;color:var(--ink)}
.srcbox{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-inline-start:4px solid var(--primary);border-radius:12px;padding:14px 16px;margin:20px 0 10px}
.srcbox>div{display:grid;gap:2px;justify-items:start}
.srcbox strong{font-size:17px;color:var(--ink)}
.srcbox a{color:var(--ink);font-weight:700;margin-top:4px}
.srcico{color:var(--primary);flex:none;margin-top:2px}
.srcs{display:grid;gap:10px;margin:16px 0 8px}
.src{display:grid;gap:2px;justify-items:start;align-content:start;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px}
.src a{margin-top:4px}
@media (min-width:700px){.srcs{grid-template-columns:1fr 1fr}}
.privacy{display:flex;gap:10px;align-items:flex-start;max-width:640px;margin:14px auto 0;text-align:start;color:var(--muted);font-size:15px;line-height:1.5}
.privacy svg{margin-top:2px}
.privacy p{margin:0;display:grid;gap:2px}
.privacy strong{color:var(--ink);font-weight:700}
.home .notice{max-width:640px;box-sizing:border-box;margin-inline:auto!important}
.row:has(.btn.sm){align-items:center}
.contact a.btn,.contact a.btn:visited{color:var(--on-primary)}
.tabs{gap:6px}
.tabs button{padding:6px 12px;font-size:15px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:10;background:var(--primary);color:var(--on-primary);border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700}
.skip:focus{top:12px}
main:focus{outline:none}
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.acclist{margin:0;padding-inline-start:20px;display:grid;gap:6px}

<script>
if(!window.DATA_site||!window.DATA_rights||!window.DATA_tasks||!window.DATA_organizations){
  document.addEventListener('DOMContentLoaded',function(){var a=document.getElementById('app');if(a)a.innerHTML='<div style="padding:40px 16px;text-align:center;font-family:Arial,sans-serif"><h1 style="font-size:22px">אחד מקובצי התוכן לא נטען</h1><p>כנראה נפלה טעות קטנה (פסיק או מירכאות) באחד הקבצים בתיקייה data. כדאי לבטל את השינוי האחרון ב-GitHub ולנסות שוב.</p></div>';});
  throw new Error('data file failed to load');

<script>
const SITE=window.DATA_site, RIGHTS=window.DATA_rights, TASKS=window.DATA_tasks, ORGS=window.DATA_organizations;
const IC={rights:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 14l2 2 4-4"/></svg>',
orgs:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="16.5" cy="9" r="2.5"/><path d="M3 20c0-3 2.5-5 5-5s5 2 5 5"/><path d="M13.5 15.5c.9-.6 1.9-1 3-1 2.3 0 4.5 1.8 4.5 4.5"/></svg>',
tasks:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L6.8 5M3.5 12l1.2 1.2 2.1-2.2M3.5 18l1.2 1.2 2.1-2.2"/></svg>'};
const TABS=[['rights','מה הזכויות שלי','זכויות, קצבאות ומענקים'],['orgs','ליווי ותמיכה','עמותות שמלוות אותך ואת הילדים'],['tasks','מה לעשות ומתי','צעד אחר צעד, מהיום הראשון']];
const S={done:false,open:{},returnY:0,tab:'rights',view:'home',cat:null,catSkipped:false,ages:[],kidsSkipped:true,count:0,stage:null,showAllTasks:false,showAllRights:false,showAllOrgs:false,id:null,back:'my'};
const LEAF='<svg viewBox="0 0 32 32" width="__W__" height="__W__" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" style="color:var(--primary)"><path d="M16 28V12"/><path d="M16 18c-5 0-8-3-8-8 5 0 8 3 8 8z"/><path d="M16 14c4 0 7-2.5 7-7-4 0-7 2.5-7 7z"/></svg>';
const leaf=w=>LEAF.replace(/__W__/g,w);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const asof=s=>esc(s).replace('{asOf}','<span class="ltr">'+SITE.asOf+'</span>');
function visible(it){
  if(S.cat && !it.categories.includes('all') && !it.categories.includes(S.cat)) return false;
  if(S.kidsSkipped) return true;
  const a=S.ages;
  if(it.kidsRule==='noKidsOnly') return a.length===0;
  if(it.kidsRule==='childInRange') return a.some(x=>x>=it.childAgeMin&&x<=it.childAgeMax);
  return true;
}
const catLabel=id=>(SITE.categories.find(c=>c.id===id)||{}).label;
function ageWord(n){return n===0?'מתחת לשנה':n>=30?'30 ומעלה':String(n)}
function summaryText(){
  return S.cat?'סיבת הפטירה של בן/בת הזוג: '+catLabel(S.cat):'מוצג כל המידע';
}
function backToList(){if(S.fromList){S.fromList=false;history.back();return}const y=S.returnY;Object.assign(S,{view:'my',menu:false});render();requestAnimationFrame(()=>window.scrollTo(0,y));}
function go(v,extra){Object.assign(S,{view:v,menu:false},extra||{});PUSH=true;render();window.scrollTo(0,0)}
function header(){
  const cur=S.view==='my'?S.tab:S.view;
  const item=(id,label,icon,attr)=>`<button ${attr} ${cur===id?'aria-current="page"':''}>${icon||''}<span>${label}</span></button>`;
  const items=item('home','דף הבית',leaf(20),'data-go="home"')+item('rights','מה הזכויות שלי',IC.rights,'data-tabgo="rights"')+item('orgs','ליווי ותמיכה',IC.orgs,'data-tabgo="orgs"')+item('tasks','מה לעשות ומתי',IC.tasks,'data-tabgo="tasks"')+item('about','על האתר','<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>','data-go="about"')+item('privacy','מדיניות פרטיות','<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>','data-go="privacy" class="m-only"')+item('access','הצהרת נגישות','<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="4.5" r="1.8"/><path d="M5 8.5l7 1.5 7-1.5M12 10v5M12 15l-3.5 6M12 15l3.5 6"/></svg>','data-go="access" class="m-only"');
  return `<header class="top"><button class="brand" data-go="home"><svg viewBox="18 28 124 112" width="34" height="31" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M22 136C22 100 36 76 60 72C80 74 92 96 94 136Z" fill="var(--primary-soft)" stroke="var(--primary)" stroke-width="2.5"/>
<path d="M66 136C68 102 82 80 104 78C126 80 138 102 138 136Z" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5"/>
<circle cx="62" cy="48" r="17" fill="var(--primary-soft)" stroke="var(--primary)" stroke-width="2.5"/>
<circle cx="91" cy="53" r="16" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5"/>
<path d="M70 92C88 84 112 88 124 106" stroke="var(--primary)" stroke-width="7"/>
<path d="M92 98C76 92 54 96 42 112" stroke="var(--accent)" stroke-width="7"/>

</svg><span class="bt">${esc(SITE.siteName)}</span></button>
  <button class="menubtn" data-act="menu" aria-expanded="${!!S.menu}" aria-controls="mainmenu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>תפריט</span></button>
  <nav class="mainnav" id="mainmenu" aria-label="תפריט ראשי" ${S.menu?'data-open':''}>${items}</nav></header>`;
}
function footer(){
  return `<footer class="site"><p>${asof(SITE.disclaimer.footer)}</p><p>נכתב בהתנדבות על ידי מרב להב · לעדכונים והצעות: <a class="maillink" dir="ltr" href="mailto:${esc(SITE.contactEmail)}">${esc(SITE.contactEmail)}</a> · <button class="linkbtn" data-go="about">על האתר</button> · <button class="linkbtn" data-go="privacy">מדיניות פרטיות</button> · <button class="linkbtn" data-go="access">הצהרת נגישות</button></p></footer>`;
}
function viewHome(){
  return `<div class="home"><svg viewBox="0 0 160 140" width="150" height="131" class="embrace" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M22 136C22 100 36 76 60 72C80 74 92 96 94 136Z" fill="var(--primary-soft)" stroke="var(--primary)" stroke-width="2.5"/>
<path d="M66 136C68 102 82 80 104 78C126 80 138 102 138 136Z" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5"/>
<circle cx="62" cy="48" r="17" fill="var(--primary-soft)" stroke="var(--primary)" stroke-width="2.5"/>
<circle cx="91" cy="53" r="16" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5"/>
<path d="M70 92C88 84 112 88 124 106" stroke="var(--primary)" stroke-width="7"/>
<path d="M92 98C76 92 54 96 42 112" stroke="var(--accent)" stroke-width="7"/>

</svg><h1>אנחנו כאן איתך</h1><p class="welcome">אם הגעת לכאן, כנראה שאיבדת את האדם הכי קרוב לך. אין מילים שיקלו על הכאב, אבל אפשר להקל על הדרך. ריכזנו בשבילך את מה שחשוב לדעת – בקצב&nbsp;שלך, בלי&nbsp;לחץ.</p>
  <p class="lead" style="margin-bottom:0">מקום אחד שעושה סדר לאלמנות ולאלמנים: מה הזכויות שלך, אילו ארגונים ועמותות יכולים ללוות ולעזור, ואיך מתמודדים עם הבירוקרטיה – צעד&nbsp;אחר&nbsp;צעד.</p><h2 style="margin:28px 0 0;font-size:22px">במה אפשר לעזור לך?</h2>
  <div class="options">${TABS.map(([id,ti,l])=>`<button class="opt" data-start="${id}"><span class="ic">${IC[id]}</span><b>${ti}</b><span class="l">${l}</span></button>`).join('')}</div>
  ${S.done&&S.cat?`<p class="notice" style="background:var(--primary-soft);margin:0 0 4px;justify-content:center;font-size:17px;flex-wrap:wrap"><span><strong>המידע מותאם לך לפי:</strong> ${esc(summaryText())}</span> <button class="linkbtn" data-act="change">לשנות את התשובה</button></p>`:`<p class="notice" style="background:var(--primary-soft);margin:0 0 4px;justify-content:center;font-size:17px"><span><strong>מותאם אישית:</strong> הצגת מידע רלוונטי עבורך לפי סיבת הפטירה של בן או בת הזוג. ניתן גם לקבל את כל המידע בלי סינון.</span></p>`}
  <div class="privacy"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="flex:none;color:var(--primary)"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><p>${SITE.disclaimer.privacyShort.split('\n').map((x,i)=>i?`<span>${esc(x)}</span>`:`<strong>${esc(x)}</strong>`).join('')}</p></div>
  <div class="dedication"><span aria-hidden="true" style="display:block;width:48px;height:1px;background:var(--accent)"></span><p>${esc(SITE.dedication)}</p>${SITE.aboutMe?`<p class="byline">${esc(SITE.aboutMe.homeLine)}<br><button class="linkbtn" data-go="about">${esc(SITE.aboutMe.homeLink)}</button></p>`:''}</div><p class="small muted" style="margin-top:24px">המידע באתר נכון ל-<span class="ltr">${SITE.asOf}</span> ואינו מחליף בדיקה מול הגוף הרשמי. הוא אינו ייעוץ משפטי.</p></div>`;
}
function viewQ1(){
  const card=c=>`<button class="choice" role="radio" aria-checked="${S.cat===c.id}" data-cat="${c.id}">${esc(c.label)}${c.hint?`<span class="hint">${esc(c.hint)}</span>`:''}</button>`;
  const groups=SITE.categories.map(card).join('');
  return `<div class="progress">שאלה אחת · <span style="white-space:nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="flex:none;color:var(--primary)"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg> התשובה לא נשמרת</span></div><h1>מה הייתה סיבת הפטירה של בן או בת הזוג?</h1><p class="muted">לכל סיבה יש זכויות, ארגונים ועמותות אחרים – כך נוכל להציג לך רק את מה שרלוונטי <strong>לך</strong>.</p><div class="catcols" role="radiogroup" aria-label="סיבת הפטירה">${groups}</div>
  <div class="row"><button class="btn ghost" data-act="skip1">לדלג ולראות את כל המידע, בלי סינון</button></div>`;
}
const ORD=['ראשון/ה','שני/ה','שלישי/ת','רביעי/ת','חמישי/ת','שישי/ת','שביעי/ת','שמיני/ת','תשיעי/ת','עשירי/ת'];
function viewQ2(){
  let rows='';
  for(let i=0;i<S.count;i++){
    let opts='';for(let a=0;a<=30;a++)opts+=`<option value="${a}" ${S.ages[i]===a?'selected':''}>${ageWord(a)}</option>`;
    rows+=`<label class="agerow" for="age${i}"><span>הגיל היום – ילד/ה ${ORD[i]}</span><select id="age${i}" data-age="${i}"><option value="" ${S.ages[i]==null?'selected':''}>בחירת גיל</option>${opts}</select></label>`;
  }
  const ready=S.ages.slice(0,S.count).filter(x=>x!=null).length===S.count;
  return `<div class="progress">שאלה 2 מתוך 2 · <span style="white-space:nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="flex:none;color:var(--primary)"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg> התשובה לא נשמרת</span></div><h1>ילדים – והגיל שלהם היום</h1><p class="muted">הגיל <strong>היום</strong>, ולא הגיל בזמן הפטירה. לפי הגיל נדע אילו זכויות ומענקים רלוונטיים עכשיו.</p>
  <p>כמה ילדים יש לך?</p><div class="stepper"><button data-act="plus" aria-label="הוספת ילד">+</button><output>${S.count}</output><button data-act="minus" aria-label="הסרת ילד">−</button></div>
  ${S.count===0?'<p class="muted">אין ילדים? אפשר להשאיר 0 ולהמשיך.</p>':rows}
  <div class="row" style="margin-top:18px"><button class="btn" data-act="done2" ${ready?'':'disabled'}>תציג לי את מה שרלוונטי לי</button><button class="btn ghost" data-act="skip2">לדלג ולראות את כל המידע, בלי סינון</button></div>`;
}
function taskCond(t){if(t.condition)return t.condition;if(t.kidsRule==='noKidsOnly')return 'אם אין ילדים';
  if(t.kidsRule==='childInRange')return t.childAgeMin>0?`אם יש ילדים בגיל ${t.childAgeMin}–${t.childAgeMax}`:`אם יש ילדים עד גיל ${t.childAgeMax}`;return '';}
function taskHtml(t){
  const more=[t.what&&`<p style="margin:0">${esc(t.what)}</p>`,t.withWhom&&`<div><span class="label">מול מי</span>${esc(t.withWhom)}</div>`,t.documents&&`<div><span class="label">מסמכים</span>${esc(t.documents)}</div>`,t.timing&&`<div><span class="label">מתי</span>${esc(t.timing)}</div>`,t.link&&`<a href="${esc(t.link)}" target="_blank" rel="noopener noreferrer">לפרטים ולמקור המידע</a>`].filter(Boolean).join('');
  const goBtn=t.goTab?`<div><button class="linkbtn" data-tabgo="${t.goTab}">לרשימת הארגונים והעמותות ←</button></div>`:'';
  const op=!!S.open[t.id];
  return `<div class="task" id="task-${t.id}" ${op?'open':''}><button aria-expanded="${op}" data-task="${t.id}"><span>${taskCond(t)?`<span class="cond">${esc(taskCond(t))}</span>`:''}${esc(t.title)}</span><span class="chev" aria-hidden="true">⌄</span></button><div class="more" ${op?'':'hidden'}>${more}${goBtn}</div></div>`;
}
const FLAGCLS={income:'fl-income',local:'fl-local',work:'fl-work'};
const flagBadges=r=>((r.flags||[]).length||ageText(r))?`<div class="flags">${agePill(r)}${(r.flags||[]).map(f=>`<span class="flag ${FLAGCLS[f.type]||''}">${esc(f.label)}</span>`).join('')}</div>`:'';
const flagBox=r=>(r.flags||[]).length?`<section class="flagbox"><span class="label">חשוב לדעת לפני שמגישים</span><ul>${r.flags.map(f=>`<li><strong>${esc(f.label)}:</strong> ${esc(f.text)}</li>`).join('')}</ul></section>`:'';
function ageText(it){if(it.kidsRule==='noKidsOnly')return 'רק למי שאין ילדים';if(it.kidsRule!=='childInRange')return '';
  const who=it.childAgeMax>18?'לילדים ולצעירים':'לילדים';return it.childAgeMin>0?`${who} בגיל ${it.childAgeMin}–${it.childAgeMax}`:`${who} עד גיל ${it.childAgeMax}`;}
const agePill=it=>ageText(it)?`<span class="flag fl-kids">${ageText(it)}</span>`:((it.helpTags&&it.kidsRule==='any'&&it.helpTags.includes('ילדים ונוער'))?'<span class="flag fl-kids">גם לילדים</span>':'');
function rightCard(r){
  return `<article class="card"><h3>${esc(r.title)}</h3>${flagBadges(r)}<p style="margin:0">${esc(r.summary)}</p>${r.amount?`<p class="amount" style="margin:0">${esc(r.amount)}<span class="star" aria-hidden="true">*</span></p>`:''}<div><button class="linkbtn" data-right="${r.id}">לפרטים</button></div></article>`;
}
const LOGO_EXT=['png','jpg','svg','webp'],LOGO={};
function logoOk(img){LOGO[img.dataset.id]=img.getAttribute('src');}
function nextLogo(img){const i=+img.dataset.i+1;
  if(i<LOGO_EXT.length){img.dataset.i=i;img.src='logos/'+img.dataset.id+'.'+LOGO_EXT[i];}
  else{LOGO[img.dataset.id]=false;const t=img.parentNode;t.classList.remove('has');t.setAttribute('role','img');t.setAttribute('aria-label',img.alt);img.outerHTML=leaf(t.classList.contains('big')?36:28);}}
function tile(o,big){const known=LOGO[o.id];const src=known===false?null:(known||'logos/'+o.id+'.png');
  return src?`<div class="tile has${big?' big':''}"><img src="${src}" data-id="${o.id}" data-i="${known?LOGO_EXT.length-1:0}" alt="${esc(o.name)}" onload="logoOk(this)" onerror="nextLogo(this)"></div>`
            :`<div class="tile${big?' big':''}" role="img" aria-label="${esc(o.name)}">${leaf(big?36:28)}</div>`;}
function orgCard(o){
  const action=o.registerUrl?`<a class="btn sm" href="${esc(o.registerUrl)}" target="_blank" rel="noopener noreferrer">להרשמה</a>`:o.website?`<a class="btn sm" href="${esc(o.website)}" target="_blank" rel="noopener noreferrer">לאתר</a>`:o.phone?`<a class="btn sm secondary" dir="ltr" href="tel:${esc(o.phone.tel)}" aria-label="להתקשר ל${esc(o.name)}, ${esc(o.phone.display)}">${esc(o.phone.display)}</a>`:'';
  return `<article class="card"><div class="orgtop">${tile(o,false)}<div><h3>${esc(o.name)}</h3>${agePill(o)?`<div class="flags" style="margin-top:4px">${agePill(o)}</div>`:''}</div></div>
  <p style="margin:0">${esc(o.oneLiner)}</p><div class="pills">${o.helpTags.slice(0,3).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div>
  <div class="row">${action}<button class="linkbtn" data-org="${o.id}">עוד פרטים</button></div></article>`;
}
function summaryBlock(){const none=!S.cat;return (none?`<div class="summary"><strong>מוצג כל המידע, בלי התאמה אישית.</strong><button class="linkbtn" data-go="q1">רוצה לסנן לפי סיבת הפטירה? שאלה אחת קצרה</button></div>`:`<p style="margin:0 0 6px;color:var(--ink)">תודה ששיתפת. אין צורך לטפל בהכול היום – אפשר לחזור לכאן בכל זמן.</p><p class="small muted" style="margin:0 0 2px">מוצג לך מידע מותאם אישית, לפי:</p><div class="summary"><strong>${esc(summaryText())}</strong><button class="linkbtn" data-go="q1">לשנות</button></div>`)+`
  <div class="notice" role="note"><span aria-hidden="true">ⓘ</span><span>${asof(SITE.disclaimer.resultsNotice)}</span></div>`}
function telify(root){

  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.go){go(b.dataset.go);return}
  if(b.dataset.cat){go('my',{done:true,cat:b.dataset.cat,catSkipped:false,kidsSkipped:true,ages:[],count:0,showAllTasks:false,showAllRights:false,showAllOrgs:false});return}
  if(b.dataset.tab){S.tab=b.dataset.tab;render();const bt=document.querySelector('.bigtabs');if(bt&&window.scrollY>bt.offsetTop)bt.scrollIntoView();return}
  if(b.dataset.tabgo){go(S.done?'my':'q1',{tab:b.dataset.tabgo});return}
  if(b.dataset.start){go(S.done?'my':'q1',{tab:b.dataset.start});return}
  if(b.dataset.jump){document.getElementById(b.dataset.jump).scrollIntoView({behavior:'smooth'});return}
  if(b.dataset.stage){S.stage=b.dataset.stage;S.showAllTasks=false;render();return}
  if(b.dataset.right){S.returnY=window.scrollY;S.fromList=S.view==='my';go('right',{id:b.dataset.right});return}
  if(b.dataset.org){if(S.view==='my')S.returnY=window.scrollY;S.fromList=S.view==='my';go('org',{id:b.dataset.org});return}
  if(b.dataset.task){const m=b.nextElementSibling;const open=m.hidden;S.open[b.dataset.task]=open;m.hidden=!open;b.setAttribute('aria-expanded',open);b.parentElement.toggleAttribute('open',open);return}
  const a=b.dataset.act;
  if(a==='skipmain'){const m=document.getElementById('main');m&&m.focus();return}
  if(a==='back'){backToList();return}
  if(a==='menu'){S.menu=!S.menu;render();return}
  if(a==='showall'){go('my',{cat:null,catSkipped:true,kidsSkipped:true,ages:[],count:0,done:true,tab:'rights'})}
  if(a==='change'){go('q1');return}
  if(a==='skip1'){go('my',{done:true,cat:null,catSkipped:true,kidsSkipped:true,ages:[],count:0})}
  if(a==='plus'&&S.count<10){S.count++;render()}
  if(a==='minus'&&S.count>0){S.count--;S.ages=S.ages.slice(0,S.count);render()}
  if(a==='done2'){go('my',{done:true,kidsSkipped:false,ages:S.ages.slice(0,S.count),showAllTasks:false,showAllRights:false,showAllOrgs:false})}
  if(a==='skip2'){go('my',{done:true,kidsSkipped:true,ages:[]})}
  if(a==='moreT'){S.showAllTasks=true;render()}
  if(a==='moreR'){S.showAllRights=true;render()}
  if(a==='moreO'){S.showAllOrgs=true;render()}
});
document.addEventListener('change',e=>{const s=e.target;if(s.dataset.age!=null){S.ages[+s.dataset.age]=s.value===''?null:+s.value;render();const n=document.getElementById('age'+s.dataset.age);n&&n.focus()}});
if(location.hash.length>1)readHash();
render();
</script>
</body>
</html>
